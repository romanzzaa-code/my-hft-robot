version: '3.8'

services:
  # Основной Rust-робот
  bot:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: hft_rust_bot
    restart: unless-stopped
    volumes:
      - ./config/strategy_params.json:/app/config/strategy_params.json
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - MY_API_KEY=${MY_API_KEY}
      - MY_API_SECRET=${MY_API_SECRET}
      - TG_COMMANDER_TOKEN=${TG_COMMANDER_TOKEN}
      - BYBIT_IS_SHADOW=${BYBIT_IS_SHADOW:-true}
      - BYBIT_IS_TESTNET=${BYBIT_IS_TESTNET:-false}
      - BYBIT_CATEGORY=${BYBIT_CATEGORY:-linear}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Можно добавить второго бота или оставить только одного
  # bot_friend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.rust
  #   container_name: hft_rust_bot_friend
  #   ...
